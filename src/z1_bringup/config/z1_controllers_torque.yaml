# controller_manager configuration for torque-control mode (real arm).
#
# z1_torque_controller claims the joints' effort command interfaces; activating
# it makes Z1System switch z1_ctrl to LOWCMD through the ros2_control command
# mode switch (see z1_ros2_control/README.md). Switching back to a position
# controller (config/z1_controllers.yaml) takes the arm back to JOINTCTRL.
#
# The torque controller and the position joint_trajectory_controller claim the
# same joints, so they live in separate controllers_file files - the same split
# as the Gazebo path (z1_controllers_gz_torque.yaml).
#
# Start with:
#   ros2 launch z1_bringup control.launch.py use_gripper:=false \
#     use_torque_control:=true \
#     controllers_file:=<z1_bringup>/config/z1_controllers_torque.yaml

controller_manager:
  ros__parameters:
    # Hz. Paces both the controller loop and the real-arm hardware component,
    # i.e. the SendCmd rate z1_ctrl sees.
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    z1_torque_controller:
      type: z1_controllers/Z1TorqueController

z1_torque_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    # Torque clamp = the joint's URDF effort limit (const.xacro: torqueMax,
    # doubled for joint2). Z1System clamps again on the wire as the last line
    # of defence.
    effort_limits:
      joint1: 30.0
      joint2: 60.0
      joint3: 30.0
      joint4: 30.0
      joint5: 30.0
      joint6: 30.0

    # Zero the output when no command arrives for this long; 0.0 disables the
    # watchdog (the last command is held).
    command_timeout: 0.25
